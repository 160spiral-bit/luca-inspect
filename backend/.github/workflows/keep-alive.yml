name: Keep backend warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 60 https://luca-ai-iozy.onrender.com/api/health && break
            echo "retry $i failed, waiting..."
            sleep 20
          done
